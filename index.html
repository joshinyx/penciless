<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>penciless</title>
    <link rel="stylesheet" href="/src/style.css" />
  </head>
  <body>
    <canvas id="canvas-bg"></canvas>
    <canvas id="canvas-fg"></canvas>

    <div id="toolbar">
      <div id="drag-handle" data-i18n-title="dragHandle" title="Arrastra para mover · Clic derecho para rotar">
        <img src="/logo-mono.png" width="22" height="22" draggable="false" />
      </div>

      <div class="sep"></div>

      <div class="section">
        <!-- Pen — Lucide Pencil -->
        <button class="tool active" data-tool="pen" data-i18n-title="pen" title="Pluma (P)">
          <svg width="15" height="15" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
            <path d="M17 3a2.85 2.85 0 1 1 4 4L7.5 20.5 2 22l1.5-5.5Z"/>
            <path d="m15 5 4 4"/>
          </svg>
        </button>
        <!-- Brush — Lucide Paintbrush -->
        <button class="tool" data-tool="brush" data-i18n-title="brush" title="Pincel (B)">
          <svg width="15" height="15" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
            <path d="M18.37 2.63 14 7l-1.59-1.59a2 2 0 0 0-2.82 0L8 7l9 9 1.59-1.59a2 2 0 0 0 0-2.82L17 10l4.37-4.37a2.12 2.12 0 1 0-3-3Z"/>
            <path d="M9 8c-2 3-4 3.5-7 4l8 10c2-1 6-5 6-7"/>
            <path d="M14.5 17.5 4.5 15"/>
          </svg>
        </button>
        <!-- Eraser — Lucide Eraser -->
        <button class="tool" data-tool="eraser" data-i18n-title="eraser" title="Borrador (E)">
          <svg width="15" height="15" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
            <path d="m7 21-4.3-4.3c-1-1-1-2.5 0-3.4l9.6-9.6c1-1 2.5-1 3.4 0l5.6 5.6c1 1 1 2.5 0 3.4L13 21"/>
            <path d="M22 21H7"/>
            <path d="m5 11 9 9"/>
          </svg>
        </button>
        <!-- Shape — Lucide Square (default, updated dynamically) -->
        <div class="shape-wrapper">
          <button class="tool" data-tool="shape" id="shape-btn" data-i18n-title="shapes" title="Formas (S)">
            <svg id="shape-icon" width="15" height="15" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
              <rect width="18" height="18" x="3" y="3" rx="2"/>
            </svg>
          </button>
          <div id="shape-menu" hidden>
            <!-- Square -->
            <button class="shape-opt active" data-shape="rect" data-i18n-title="shapeRect" title="Rectángulo">
              <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
                <rect width="18" height="18" x="3" y="3" rx="2"/>
              </svg>
            </button>
            <!-- Circle -->
            <button class="shape-opt" data-shape="circle" data-i18n-title="shapeCircle" title="Círculo">
              <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
                <circle cx="12" cy="12" r="10"/>
              </svg>
            </button>
            <!-- Diamond -->
            <button class="shape-opt" data-shape="diamond" data-i18n-title="shapeDiamond" title="Rombo">
              <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
                <path d="M2.7 10.3a2.41 2.41 0 0 0 0 3.41l7.59 7.59a2.41 2.41 0 0 0 3.41 0l7.59-7.59a2.41 2.41 0 0 0 0-3.41L13.7 2.71a2.41 2.41 0 0 0-3.41 0z"/>
              </svg>
            </button>
            <!-- Triangle -->
            <button class="shape-opt" data-shape="triangle" data-i18n-title="shapeTriangle" title="Triángulo">
              <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
                <path d="M13.73 4a2 2 0 0 0-3.46 0l-8 14A2 2 0 0 0 4 21h16a2 2 0 0 0 1.73-3z"/>
              </svg>
            </button>
            <!-- Hexagon -->
            <button class="shape-opt" data-shape="hexagon" data-i18n-title="shapeHexagon" title="Hexágono">
              <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
                <path d="M21 16V8a2 2 0 0 0-1-1.73l-7-4a2 2 0 0 0-2 0l-7 4A2 2 0 0 0 3 8v8a2 2 0 0 0 1 1.73l7 4a2 2 0 0 0 2 0l7-4A2 2 0 0 0 21 16z"/>
              </svg>
            </button>
            <!-- Star -->
            <button class="shape-opt" data-shape="star" data-i18n-title="shapeStar" title="Estrella">
              <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
                <polygon points="12 2 15.09 8.26 22 9.27 17 14.14 18.18 21.02 12 17.77 5.82 21.02 7 14.14 2 9.27 8.91 8.26 12 2"/>
              </svg>
            </button>
          </div>
        </div>
      </div>

      <div class="sep"></div>

      <!-- Color: just the swatch button — everything else lives in the popup -->
      <div class="section" id="color-section">
        <button id="color-picker-btn" data-i18n-title="color" title="Color (C)">
          <div id="color-swatch"></div>
        </button>
      </div>

      <div class="sep"></div>

      <div class="section" id="size-section">
        <input type="range" id="size-slider" min="1" max="50" value="4" />
        <input type="text" inputmode="numeric" id="size-value" maxlength="2" value="4" /><span class="size-unit">px</span>
      </div>

      <div class="sep"></div>

      <!-- Clear — Lucide Trash2 -->
      <button id="btn-clear" class="tool" data-i18n-title="clear" title="Limpiar todo (Delete)">
        <svg width="15" height="15" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
          <path d="M3 6h18"/>
          <path d="M19 6v14c0 1-1 2-2 2H7c-1 0-2-1-2-2V6"/>
          <path d="M8 6V4c0-1 1-2 2-2h4c1 0 2 1 2 2v2"/>
          <line x1="10" x2="10" y1="11" y2="17"/>
          <line x1="14" x2="14" y1="11" y2="17"/>
        </svg>
      </button>
    </div>

    <!-- Custom color picker popup -->
    <div id="color-popup" hidden>
      <div id="sv-area">
        <canvas id="sv-canvas" width="200" height="140"></canvas>
        <div id="sv-thumb"></div>
      </div>
      <div id="hue-area">
        <canvas id="hue-canvas" width="200" height="12"></canvas>
        <div id="hue-thumb"></div>
      </div>
      <div id="popup-hex-row">
        <span class="hex-hash">#</span>
        <input id="popup-hex" type="text" maxlength="6" spellcheck="false"
               autocomplete="off" placeholder="EF4444" />
      </div>
      <div id="popup-recent"></div>
    </div>

    <script type="module" src="/src/main.ts"></script>
  </body>
</html>
