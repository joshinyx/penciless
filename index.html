<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>penciless</title>
    <link rel="stylesheet" href="/src/style.css" />
  </head>
  <body>
    <canvas id="canvas-bg"></canvas>
    <canvas id="canvas-fg"></canvas>

    <div id="toolbar">
      <div id="drag-handle" data-i18n-title="dragHandle" title="Arrastra para mover · Clic derecho para rotar">
        <img src="/logo-mono.png" width="22" height="22" draggable="false" />
      </div>

      <div class="sep"></div>

      <div class="section">
        <!-- Pen — Phosphor PencilSimple -->
        <button class="tool active" data-tool="pen" data-i18n-title="pen" title="Pluma (P)">
          <svg class="icon-outline" width="15" height="15" viewBox="0 0 256 256" fill="currentColor"><path d="M227.31,73.37,182.63,28.68a16,16,0,0,0-22.63,0L36.69,152A15.86,15.86,0,0,0,32,163.31V208a16,16,0,0,0,16,16H92.69A15.86,15.86,0,0,0,104,219.31L227.31,96a16,16,0,0,0,0-22.63ZM92.69,208H48V163.31l88-88L180.69,120ZM192,108.68,147.31,64l24-24L216,84.68Z"/></svg>
          <svg class="icon-fill"    width="15" height="15" viewBox="0 0 256 256" fill="currentColor"><path d="M227.31,73.37,182.63,28.68a16,16,0,0,0-22.63,0L36.69,152A15.86,15.86,0,0,0,32,163.31V208a16,16,0,0,0,16,16H92.69A15.86,15.86,0,0,0,104,219.31L227.31,96a16,16,0,0,0,0-22.63ZM192,108.68,147.31,64l24-24L216,84.68Z"/></svg>
        </button>
        <!-- Brush — Phosphor PaintBrush -->
        <button class="tool" data-tool="brush" data-i18n-title="brush" title="Pincel (B)">
          <svg class="icon-outline" width="15" height="15" viewBox="0 0 256 256" fill="currentColor"><path d="M232,32a8,8,0,0,0-8-8c-44.08,0-89.31,49.71-114.43,82.63A60,60,0,0,0,32,164c0,30.88-19.54,44.73-20.47,45.37A8,8,0,0,0,16,224H92a60,60,0,0,0,57.37-77.57C182.3,121.31,232,76.08,232,32ZM92,208H34.63C41.38,198.41,48,183.92,48,164a44,44,0,1,1,44,44Zm32.42-94.45q5.14-6.66,10.09-12.55A76.23,76.23,0,0,1,155,121.49q-5.9,4.94-12.55,10.09A60.54,60.54,0,0,0,124.42,113.55Zm42.7-2.68a92.57,92.57,0,0,0-22-22c31.78-34.53,55.75-45,69.9-47.91C212.17,55.12,201.65,79.09,167.12,110.87Z"/></svg>
          <svg class="icon-fill"    width="15" height="15" viewBox="0 0 256 256" fill="currentColor"><path d="M232,32a8,8,0,0,0-8-8c-44.08,0-89.31,49.71-114.43,82.63A60,60,0,0,0,32,164c0,30.88-19.54,44.73-20.47,45.37A8,8,0,0,0,16,224H92a60,60,0,0,0,57.37-77.57C182.3,121.31,232,76.08,232,32ZM124.42,113.55q5.14-6.66,10.09-12.55A76.23,76.23,0,0,1,155,121.49q-5.9,4.94-12.55,10.09A60.54,60.54,0,0,0,124.42,113.55Zm42.7-2.68a92.57,92.57,0,0,0-22-22c31.78-34.53,55.75-45,69.9-47.91C212.17,55.12,201.65,79.09,167.12,110.87Z"/></svg>
        </button>
        <!-- Eraser — Phosphor Eraser -->
        <button class="tool" data-tool="eraser" data-i18n-title="eraser" title="Borrador (E)">
          <svg class="icon-outline" width="15" height="15" viewBox="0 0 256 256" fill="currentColor"><path d="M225,80.4,183.6,39a24,24,0,0,0-33.94,0L31,157.66a24,24,0,0,0,0,33.94l30.06,30.06A8,8,0,0,0,66.74,224H216a8,8,0,0,0,0-16h-84.7L225,114.34A24,24,0,0,0,225,80.4ZM108.68,208H70.05L42.33,180.28a8,8,0,0,1,0-11.31L96,115.31,148.69,168Zm105-105L160,156.69,107.31,104,161,50.34a8,8,0,0,1,11.32,0l41.38,41.38a8,8,0,0,1,0,11.31Z"/></svg>

        </button>
        <!-- Shape — Phosphor Rectangle (default, updated dynamically) -->
        <div class="shape-wrapper">
          <button class="tool" data-tool="shape" id="shape-btn" data-i18n-title="shapes" title="Formas (S)">
            <svg id="shape-icon-outline" class="icon-outline" width="15" height="15" viewBox="0 0 256 256" fill="currentColor"><path d="M216,40H40A16,16,0,0,0,24,56V200a16,16,0,0,0,16,16H216a16,16,0,0,0,16-16V56A16,16,0,0,0,216,40Zm0,160H40V56H216V200Z"/></svg>
            <svg id="shape-icon-fill"    class="icon-fill"    width="15" height="15" viewBox="0 0 256 256" fill="currentColor"><path d="M232,56V200a16,16,0,0,1-16,16H40a16,16,0,0,1-16-16V56A16,16,0,0,1,40,40H216A16,16,0,0,1,232,56Z"/></svg>
          </button>
          <div id="shape-menu" hidden>
            <!-- Rectangle -->
            <button class="shape-opt active" data-shape="rect" data-i18n-title="shapeRect" title="Rectángulo">
              <svg class="icon-outline" viewBox="0 0 256 256" fill="currentColor"><path d="M216,40H40A16,16,0,0,0,24,56V200a16,16,0,0,0,16,16H216a16,16,0,0,0,16-16V56A16,16,0,0,0,216,40Zm0,160H40V56H216V200Z"/></svg>
              <svg class="icon-fill"    viewBox="0 0 256 256" fill="currentColor"><path d="M232,56V200a16,16,0,0,1-16,16H40a16,16,0,0,1-16-16V56A16,16,0,0,1,40,40H216A16,16,0,0,1,232,56Z"/></svg>
            </button>
            <!-- Circle -->
            <button class="shape-opt" data-shape="circle" data-i18n-title="shapeCircle" title="Círculo">
              <svg class="icon-outline" viewBox="0 0 256 256" fill="currentColor"><path d="M128,24A104,104,0,1,0,232,128,104.11,104.11,0,0,0,128,24Zm0,192a88,88,0,1,1,88-88A88.1,88.1,0,0,1,128,216Z"/></svg>
              <svg class="icon-fill"    viewBox="0 0 256 256" fill="currentColor"><path d="M232,128A104,104,0,1,1,128,24,104.13,104.13,0,0,1,232,128Z"/></svg>
            </button>
            <!-- Diamond -->
            <button class="shape-opt" data-shape="diamond" data-i18n-title="shapeDiamond" title="Rombo">
              <svg class="icon-outline" viewBox="0 0 256 256" fill="currentColor"><path d="M235.33,116.72,139.28,20.66a16,16,0,0,0-22.56,0l-96,96.06a16,16,0,0,0,0,22.56l96.05,96.06h0a16,16,0,0,0,22.56,0l96.05-96.06a16,16,0,0,0,0-22.56ZM128,224h0L32,128,128,32,224,128Z"/></svg>
              <svg class="icon-fill"    viewBox="0 0 256 256" fill="currentColor"><path d="M240,128a15.85,15.85,0,0,1-4.67,11.28l-96.05,96.06a16,16,0,0,1-22.56,0h0l-96-96.06a16,16,0,0,1,0-22.56l96.05-96.06a16,16,0,0,1,22.56,0l96.05,96.06A15.85,15.85,0,0,1,240,128Z"/></svg>
            </button>
            <!-- Triangle -->
            <button class="shape-opt" data-shape="triangle" data-i18n-title="shapeTriangle" title="Triángulo">
              <svg class="icon-outline" viewBox="0 0 256 256" fill="currentColor"><path d="M236.8,188.09,149.35,36.22a24.76,24.76,0,0,0-42.7,0L19.2,188.09a23.51,23.51,0,0,0,0,23.72A24.34,24.34,0,0,0,40.55,224h174.9a24.34,24.34,0,0,0,21.33-12.19A23.51,23.51,0,0,0,236.8,188.09ZM222.93,203.8a8.5,8.5,0,0,1-7.48,4.2H40.55a8.5,8.5,0,0,1-7.48-4.2,7.59,7.59,0,0,1,0-7.72L120.52,44.21a8.75,8.75,0,0,1,15,0l87.45,151.87A7.59,7.59,0,0,1,222.93,203.8Z"/></svg>
              <svg class="icon-fill"    viewBox="0 0 256 256" fill="currentColor"><path d="M236.78,211.81A24.34,24.34,0,0,1,215.45,224H40.55a24.34,24.34,0,0,1-21.33-12.19,23.51,23.51,0,0,1,0-23.72L106.65,36.22a24.76,24.76,0,0,1,42.7,0L236.8,188.09A23.51,23.51,0,0,1,236.78,211.81Z"/></svg>
            </button>
            <!-- Hexagon -->
            <button class="shape-opt" data-shape="hexagon" data-i18n-title="shapeHexagon" title="Hexágono">
              <svg class="icon-outline" viewBox="0 0 256 256" fill="currentColor"><path d="M223.68,66.15,135.68,18h0a15.88,15.88,0,0,0-15.36,0l-88,48.17a16,16,0,0,0-8.32,14v95.64a16,16,0,0,0,8.32,14l88,48.17a15.88,15.88,0,0,0,15.36,0l88-48.17a16,16,0,0,0,8.32-14V80.18A16,16,0,0,0,223.68,66.15ZM216,175.82,128,224,40,175.82V80.18L128,32h0l88,48.17Z"/></svg>
              <svg class="icon-fill"    viewBox="0 0 256 256" fill="currentColor"><path d="M232,80.18v95.64a16,16,0,0,1-8.32,14l-88,48.17a15.88,15.88,0,0,1-15.36,0l-88-48.17a16,16,0,0,1-8.32-14V80.18a16,16,0,0,1,8.32-14l88-48.17a15.88,15.88,0,0,1,15.36,0l88,48.17A16,16,0,0,1,232,80.18Z"/></svg>
            </button>
            <!-- Star -->
            <button class="shape-opt" data-shape="star" data-i18n-title="shapeStar" title="Estrella">
              <svg class="icon-outline" viewBox="0 0 256 256" fill="currentColor"><path d="M239.18,97.26A16.38,16.38,0,0,0,224.92,86l-59-4.76L143.14,26.15a16.36,16.36,0,0,0-30.27,0L90.11,81.23,31.08,86a16.46,16.46,0,0,0-9.37,28.86l45,38.83L53,211.75a16.38,16.38,0,0,0,24.5,17.82L128,198.49l50.53,31.08A16.4,16.4,0,0,0,203,211.75l-13.76-58.07,45-38.83A16.43,16.43,0,0,0,239.18,97.26Zm-15.34,5.47-48.7,42a8,8,0,0,0-2.56,7.91l14.88,62.8a.37.37,0,0,1-.17.48c-.18.14-.23.11-.38,0l-54.72-33.65a8,8,0,0,0-8.38,0L69.09,215.94c-.15.09-.19.12-.38,0a.37.37,0,0,1-.17-.48l14.88-62.8a8,8,0,0,0-2.56-7.91l-48.7-42c-.12-.1-.23-.19-.13-.5s.18-.27.33-.29l63.92-5.16A8,8,0,0,0,103,91.86l24.62-59.61c.08-.17.11-.25.35-.25s.27.08.35.25L153,91.86a8,8,0,0,0,6.75,4.92l63.92,5.16c.15,0,.24,0,.33.29S224,102.63,223.84,102.73Z"/></svg>
              <svg class="icon-fill"    viewBox="0 0 256 256" fill="currentColor"><path d="M234.29,114.85l-45,38.83L203,211.75a16.4,16.4,0,0,1-24.5,17.82L128,198.49,77.47,229.57A16.4,16.4,0,0,1,53,211.75l13.76-58.07-45-38.83A16.46,16.46,0,0,1,31.08,86l59-4.76,22.76-55.08a16.36,16.36,0,0,1,30.27,0l22.75,55.08,59,4.76a16.46,16.46,0,0,1,9.37,28.86Z"/></svg>
            </button>
          </div>
        </div>
      </div>

      <div class="sep"></div>

      <!-- Color: just the swatch button — everything else lives in the popup -->
      <div class="section" id="color-section">
        <button id="color-picker-btn" data-i18n-title="color" title="Color (C)">
          <div id="color-swatch"></div>
        </button>
      </div>

      <div class="sep"></div>

      <div class="section" id="size-section">
        <input type="range" id="size-slider" min="1" max="50" value="4" />
        <input type="text" inputmode="numeric" id="size-value" maxlength="2" value="4" /><span class="size-unit">px</span>
      </div>

      <div class="sep"></div>

      <!-- Clear — Lucide Trash2 -->
      <button id="btn-clear" class="tool" data-i18n-title="clear" title="Limpiar todo (Delete)">
        <svg width="15" height="15" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
          <path d="M3 6h18"/>
          <path d="M19 6v14c0 1-1 2-2 2H7c-1 0-2-1-2-2V6"/>
          <path d="M8 6V4c0-1 1-2 2-2h4c1 0 2 1 2 2v2"/>
          <line x1="10" x2="10" y1="11" y2="17"/>
          <line x1="14" x2="14" y1="11" y2="17"/>
        </svg>
      </button>
    </div>

    <!-- Custom color picker popup -->
    <div id="color-popup" hidden>
      <div id="sv-area">
        <canvas id="sv-canvas" width="200" height="140"></canvas>
        <div id="sv-thumb"></div>
      </div>
      <div id="hue-area">
        <canvas id="hue-canvas" width="200" height="12"></canvas>
        <div id="hue-thumb"></div>
      </div>
      <div id="popup-hex-row">
        <span class="hex-hash">#</span>
        <input id="popup-hex" type="text" maxlength="6" spellcheck="false"
               autocomplete="off" placeholder="EF4444" />
      </div>
      <div id="popup-recent"></div>
    </div>

    <script type="module" src="/src/main.ts"></script>
  </body>
</html>
